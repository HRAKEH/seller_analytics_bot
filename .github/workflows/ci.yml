name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TELEGRAM_BOT_TOKEN: "123456:TEST_TOKEN"
      TELEGRAM_OWNER_ID: "1"
      DB_FILE: "/tmp/seller-analytics-ci.sqlite3"
      LOG_FORMAT: "json"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 013ed48f1aeb1864c020343feb56d929510567b0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Compile
        run: python -m compileall -q app main.py scripts tests
      - name: Tests
        run: python -m pytest -q
      - name: Release audit
        run: python scripts/release_audit.py
      - name: Deployment preflight
        run: python scripts/preflight.py

      - name: Package current stage
        run: zip -qr seller_analytics_bot_current_stage.zip . -x '.git/*' 'seller_analytics_bot_current_stage.zip'
      - name: Upload current stage
        uses: actions/upload-artifact@v4
        with:
          name: seller_analytics_bot_current_stage
          path: seller_analytics_bot_current_stage.zip
          if-no-files-found: error
